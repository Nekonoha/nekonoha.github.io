<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>針の筵 — ネコノハ</title>
  <meta name="description" content="ネコノハの音楽・ゲーム・イラスト・小説・3Dモデル。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="針の筵">
  <meta property="og:title" content="針の筵 — ネコノハ">
  <meta property="og:description" content="ネコノハの音楽・ゲーム・イラスト・小説・3Dモデル。">
  <meta property="og:url" content="https://nekonoha.github.io/">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="icon" href="/images/mat_favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Murecho:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script>
    // 保存した配色と言語を、描画の前に当てる（ちらつき防止）
    try {
      const saved = localStorage.getItem('rd-theme')
      document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    } catch {}
    try {
      const asked = new URLSearchParams(location.search).get('lang')
      const saved = JSON.parse(localStorage.getItem('rd-lang') || 'null')
      document.documentElement.lang = asked === 'en' || asked === 'ja' ? asked : saved === 'en' || saved === 'ja' ? saved : (navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en'
    } catch {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-game" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 10.5v4M5.5 12.5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15.5" cy="11.5" r="1.2" fill="currentColor"/><circle cx="18" cy="14" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-brush" viewBox="0 0 24 24"><path d="M14.5 4.5l5 5-8 8-5-5 8-8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6.5 12.5 3 21l8.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 1 4 20.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z" fill="currentColor"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 18 9 6l5 12M5.8 14h6.4M15 18l3-7 3 7M15.9 16h4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 4h4l10 16h-4L5 4ZM19 4l-6.5 7M5 20l6.5-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div class="ambient" aria-hidden="true"><div class="ambient-glow"></div><div class="ambient-grain"></div></div>
  <a class="skip" href="#view" data-t="skip">本文へ移動</a>

  <!-- 上のバー。文字は app.js が言語に合わせて入れる -->
  <header class="bar">
    <a class="logo" href="#/">針の筵</a>
    <div class="bar-tools">
      <button class="search-btn" type="button" data-action="search"><svg><use href="#i-search"/></svg><span data-t="search">探す</span><kbd>Ctrl K</kbd></button>
      <button class="lang-btn" type="button" data-action="lang">EN</button>
      <button class="icon-btn" type="button" data-action="theme"><svg class="when-dark"><use href="#i-sun"/></svg><svg class="when-light"><use href="#i-moon"/></svg></button>
    </div>
  </header>
  <!-- セクションの移動。スマホ・タブレットでは親指の届く下側（dock）、マウスのPCでは左端の目次（rail）。中身は app.js が作る -->
  <nav class="dock"><span class="dock-pill" aria-hidden="true"></span></nav>
  <nav class="rail"></nav>
  <!-- いちばん上へ。まわりの輪は、ページのどこまで来たか -->
  <button class="to-top" type="button" data-action="top" tabindex="-1" aria-hidden="true"><svg class="ring" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24.5" pathLength="1"/></svg><svg aria-hidden="true"><use href="#i-up"/></svg></button>

  <main id="view" tabindex="-1"></main>

  <dialog class="palette">
    <form method="dialog" class="palette-box">
      <label class="palette-field"><svg><use href="#i-search"/></svg><input type="search" autocomplete="off" enterkeyhint="go" aria-controls="palette-list"></label>
      <ul id="palette-list" class="palette-list" role="listbox"></ul>
      <p class="palette-hint"><span><kbd>↑</kbd><kbd>↓</kbd> <span data-t="pick">選ぶ</span></span><span><kbd>Enter</kbd> <span data-t="open">開く</span></span><span><kbd>Esc</kbd> <span data-t="close">閉じる</span></span></p>
    </form>
  </dialog>

  <dialog class="lightbox">
    <img alt="">
    <button class="lb-btn lb-close" type="button" data-action="lb-close"><svg><use href="#i-close"/></svg></button>
    <button class="lb-btn lb-prev" type="button" data-action="lb-prev"><svg><use href="#i-left"/></svg></button>
    <button class="lb-btn lb-next" type="button" data-action="lb-next"><svg><use href="#i-right"/></svg></button>
    <p class="lb-count"></p>
  </dialog>

  <div class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
